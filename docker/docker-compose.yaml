services:  

  #APP
  app:
    container_name: app
    build:
      context: ..
      dockerfile: docker/app-consumer/Dockerfile
    ports:
      - 1337:8080
    env_file:
     - ../.env.consumer
    depends_on:
      migration:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully


  #APP-PRODUCER
  app-producer:
    container_name: app-producer
    build:
      context: ..
      dockerfile: docker/app-producer/Dockerfile
    env_file:
     - ../.env.producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully

  #KAFKA
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "1"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_CFG_LOG_DIRS: /var/lib/kafka/data

    healthcheck:
      test:  ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: on-failure

    volumes:
        - kafka-data:/var/lib/kafka/data

  #CREATE TOPICS
  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: init-topics
    entrypoint: ["/bin/bash","-lc"]
    command: ["/usr/local/bin/init-topics.sh"]
    volumes:
      - ./kafka/init-topics.sh:/usr/local/bin/init-topics.sh:ro
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy


  # DATABASE
  database:
    image: postgres:17
    container_name: pgsql-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${PGSQL_HOST_PORT}:5432
    volumes:
      - postgres_lvl_0_data:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # MIGRATION
  migration:
    image: migrate/migrate
    container_name: db-migrate
    environment:
      DB_URL: ${DB_URL}
    volumes:
      - ./database/migrations:/migrations
    command: ["-path", "/migrations", "-database","${DB_URL}", "up"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"


volumes:
  kafka-data:
  postgres_lvl_0_data:
